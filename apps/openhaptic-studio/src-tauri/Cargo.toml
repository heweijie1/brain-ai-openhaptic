[package]
name = "openhaptic-studio"
version = "0.1.0"
description = "OpenHapticAI Studio desktop workbench"
authors = ["OpenHapticAI"]
license = "AGPL-3.0-or-later"
edition = "2021"

[package.metadata]

[lib]
name = "openhaptic_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
